<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse - Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <!-- Auth Container (Shown when logged out) -->
    <div id="authContainer" class="container py-5" style="max-width: 450px;">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 text-primary fw-bold">🐾 PetPulse</h3>
                
                <!-- Toggle Tabs -->
                <ul class="nav nav-pills nav-justified mb-3" id="pills-tab" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginView">Login</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#registerView">Register</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- Login View -->
                    <div class="tab-pane fade show active" id="loginView">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" id="loginUsername" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="loginPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Log In</button>
                        </form>
                    </div>

                    <!-- Register View -->
                    <div class="tab-pane fade" id="registerView">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" id="regUsername" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="regPassword" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">I am a...</label>
                                <select id="regRole" class="form-select" required>
                                    <option value="ROLE_OWNER" selected>Pet Owner</option>
                                    <option value="ROLE_VET">Veterinarian</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Create Account</button>
                        </form>
                    </div>
                </div>
                
                <div id="authAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Container (Hidden until logged in) -->
    <div id="dashboardContainer" class="container py-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Welcome, <span id="welcomeUser" class="text-primary"></span>! 🐾</h2>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Log Out</button>
        </div>

        <!-- Vet Clinical Lookup Portal (Visible to Vets only) -->
        <div id="vetPortal" class="card shadow-sm mb-4 d-none">
            <div class="card-header bg-dark text-white">
                <h5 class="card-title mb-0">🩺 Veterinarian Clinical Lookup</h5>
            </div>
            <div class="card-body">
                <div class="input-group">
                    <input type="text" id="searchPetId" class="form-control" placeholder="Enter Pet ID (e.g., p001)">
                    <button onclick="searchPet()" class="btn btn-primary">Search Pet History</button>
                </div>
                <div id="vetSearchResult" class="mt-3"></div>
            </div>
        </div>

        <!-- Pet Owner Views -->
        <div id="ownerPortal" class="row">
            <!-- Add Pet Form -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Add New Pet</h5>
                    </div>
                    <div class="card-body">
                        <form id="petForm">
                            <div class="mb-3">
                                <label class="form-label">Pet ID</label>
                                <input type="text" id="petId" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" id="petName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Breed</label>
                                <input type="text" id="petBreed" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Age (Years)</label>
                                <input type="number" id="petAge" class="form-control" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Weight (kg)</label>
                                <input type="number" step="0.1" id="petWeight" class="form-control" min="0.1" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Save Pet</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Pet List & Visual Analytics -->
            <div class="col-md-8">
                <!-- Analytics Chart -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-light">
                        <h5 class="card-title mb-0">Weight Distribution</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="weightChart" style="max-height: 250px;"></canvas>
                    </div>
                </div>

                <!-- Pet Table -->
                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="card-title mb-0">Your Pets</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Breed</th>
                                        <th>Age</th>
                                        <th>Weight</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="petTableBody">
                                    <!-- Dynamic rows loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_URL = '/api';
        let weightChart = null;

        // Auto-check active session on startup
        document.addEventListener('DOMContentLoaded', () => {
            const userId = localStorage.getItem('userId');
            const username = localStorage.getItem('username');
            const userRole = localStorage.getItem('userRole');
            if (userId && username) {
                showDashboard(username, userRole);
            }
        });

        // Login Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const user = await res.json();
                    localStorage.setItem('userId', user.id);
                    localStorage.setItem('username', user.username);
                    localStorage.setItem('userRole', user.role || 'ROLE_OWNER');
                    showDashboard(user.username, user.role);
                } else {
                    showAlert('Invalid username or password');
                }
            } catch (err) {
                showAlert('Connection error. Is the backend server running?');
            }
        });

        // Register Submit
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;

            try {
                const res = await fetch(`${API_URL}/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                if (res.ok) {
                    alert('Account created successfully! Please log in.');
                    location.reload();
                } else {
                    const msg = await res.text();
                    showAlert(msg || 'Registration failed');
                }
            } catch (err) {
                showAlert('Connection error. Is the backend server running?');
            }
        });

        // Add Pet Submit
        document.getElementById('petForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = localStorage.getItem('userId');

            if (!userId) {
                alert('Session expired. Please log in again.');
                logout();
                return;
            }

            const petData = {
                id: document.getElementById('petId').value,
                name: document.getElementById('petName').value,
                breed: document.getElementById('petBreed').value,
                age: parseInt(document.getElementById('petAge').value),
                weight: parseFloat(document.getElementById('petWeight').value)
            };

            try {
                const res = await fetch(`${API_URL}/pets?userId=${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(petData)
                });

                if (res.ok) {
                    document.getElementById('petForm').reset();
                    await loadPets();
                } else {
                    alert('Failed to save pet record. Status: ' + res.status);
                }
            } catch (err) {
                console.error("Error saving pet:", err);
            }
        });

        // Delete Pet
        async function deletePet(id) {
            if (confirm('Are you sure you want to delete this pet profile?')) {
                await fetch(`${API_URL}/pets/${id}`, { method: 'DELETE' });
                loadPets();
            }
        }

        // Fetch & Render User-Specific Pets
        async function loadPets() {
            const userId = localStorage.getItem('userId');
            if (!userId) return;

            try {
                const res = await fetch(`${API_URL}/pets?userId=${userId}`);
                if (!res.ok) return;

                const pets = await res.json();
                const tbody = document.getElementById('petTableBody');
                tbody.innerHTML = '';

                if (pets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No pets registered yet.</td></tr>';
                    renderChart([]);
                    return;
                }

                pets.forEach(pet => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${pet.id}</td>
                            <td><strong>${pet.name}</strong></td>
                            <td>${pet.breed}</td>
                            <td>${pet.age} yrs</td>
                            <td>${pet.weight} kg</td>
                            <td>
                                <button onclick="deletePet('${pet.id}')" class="btn btn-outline-danger btn-sm">Delete</button>
                            </td>
                        </tr>
                    `;
                });

                renderChart(pets);
            } catch (err) {
                console.error("Error loading pets:", err);
            }
        }

        // Chart.js Visualization
        function renderChart(pets) {
            const ctx = document.getElementById('weightChart').getContext('2d');
            
            if (weightChart) {
                weightChart.destroy();
            }

            weightChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: pets.map(p => p.name),
                    datasets: [{
                        label: 'Weight (kg)',
                        data: pets.map(p => p.weight),
                        backgroundColor: 'rgba(13, 110, 253, 0.65)',
                        borderColor: 'rgba(13, 110, 253, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Search Pet for Vet Clinical View
        async function searchPet() {
            const petId = document.getElementById('searchPetId').value.trim();
            if (!petId) return;

            const resultDiv = document.getElementById('vetSearchResult');
            
            try {
                const petRes = await fetch(`${API_URL}/vet/pet/${petId}`);
                if (!petRes.ok) {
                    resultDiv.innerHTML = `<div class="alert alert-warning">No pet found with ID: ${petId}</div>`;
                    return;
                }
                const pet = await petRes.json();

                const recordsRes = await fetch(`${API_URL}/vet/records/${petId}`);
                const records = await recordsRes.json();

                let recordsHtml = records.map(r => `
                    <li class="list-group-item">
                        <small class="text-muted">Visit Date: ${r.visitDate}</small><br>
                        <strong>Diagnosis:</strong> ${r.diagnosis}<br>
                        <strong>Treatment:</strong> ${r.treatment}<br>
                        <em>${r.vetNotes || ''}</em>
                    </li>
                `).join('');

                resultDiv.innerHTML = `
                    <div class="card border-primary mb-3">
                        <div class="card-body">
                            <h5 class="card-title">${pet.name} (${pet.breed})</h5>
                            <p class="card-text">Age: ${pet.age} yrs | Weight: ${pet.weight} kg</p>
                            
                            <h6>Medical Records</h6>
                            <ul class="list-group mb-3">${recordsHtml || '<li class="list-group-item text-muted">No medical records found.</li>'}</ul>

                            <h6>Add Clinical Note</h6>
                            <input type="text" id="diagInput" class="form-control mb-2" placeholder="Diagnosis">
                            <input type="text" id="treatInput" class="form-control mb-2" placeholder="Treatment">
                            <textarea id="notesInput" class="form-control mb-2" placeholder="Clinical Notes"></textarea>
                            <button onclick="saveHealthRecord('${pet.id}')" class="btn btn-success btn-sm">Save Medical Record</button>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error("Error fetching pet details:", err);
            }
        }

        // Save Health Record from Vet Portal
        async function saveHealthRecord(petId) {
            const diagnosis = document.getElementById('diagInput').value;
            const treatment = document.getElementById('treatInput').value;
            const vetNotes = document.getElementById('notesInput').value;

            const res = await fetch(`${API_URL}/vet/records/${petId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diagnosis, treatment, vetNotes })
            });

            if (res.ok) {
                alert('Health record logged successfully!');
                searchPet();
            } else {
                alert('Failed to save health record.');
            }
        }

        function showDashboard(username, role) {
            document.getElementById('authContainer').classList.add('d-none');
            document.getElementById('dashboardContainer').classList.remove('d-none');
            document.getElementById('welcomeUser').textContent = username;

            if (role === 'ROLE_VET') {
                document.getElementById('vetPortal').classList.remove('d-none');
                document.getElementById('ownerPortal').classList.add('d-none');
            } else {
                document.getElementById('vetPortal').classList.add('d-none');
                document.getElementById('ownerPortal').classList.remove('d-none');
                loadPets();
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('authAlert');
            alertBox.textContent = msg;
            alertBox.classList.remove('d-none');
        }
		async function loadPets() {
		    const userId = localStorage.getItem('userId');
		    if (!userId) return;

		    try {
		        const res = await fetch(`${API_URL}/pets?userId=${userId}`);
		        if (!res.ok) return;

		        const pets = await res.json();
		        const tbody = document.getElementById('petTableBody');
		        tbody.innerHTML = '';

		        if (pets.length === 0) {
		            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No pets registered yet.</td></tr>';
		            renderChart([]);
		            return;
		        }

		        for (const pet of pets) {
		            // Fetch medical records for each pet
		            const recordsRes = await fetch(`${API_URL}/vet/records/${pet.id}`);
		            const records = await recordsRes.json();
		            
		            let recordBadge = records.length > 0 
		                ? `<button onclick="viewPetHistory('${pet.id}', '${pet.name}')" class="btn btn-sm btn-outline-info me-1">${records.length} Record(s)</button>`
		                : `<span class="badge bg-secondary me-1">No Records</span>`;

		            tbody.innerHTML += `
		                <tr>
		                    <td>${pet.id}</td>
		                    <td><strong>${pet.name}</strong></td>
		                    <td>${pet.breed}</td>
		                    <td>${pet.age} yrs</td>
		                    <td>${pet.weight} kg</td>
		                    <td>
		                        ${recordBadge}
		                        <button onclick="deletePet('${pet.id}')" class="btn btn-outline-danger btn-sm">Delete</button>
		                    </td>
		                </tr>
		            `;
		        }

		        renderChart(pets);
		    } catch (err) {
		        console.error("Error loading pets:", err);
		    }
		}

		// Display Medical History Modal / Alert for Owner
		async function viewPetHistory(petId, petName) {
		    const res = await fetch(`${API_URL}/vet/records/${petId}`);
		    const records = await res.json();

		    let historyText = records.map(r => 
		        `📅 Date: ${r.visitDate}\n🩺 Diagnosis: ${r.diagnosis}\n💊 Treatment: ${r.treatment}\n📝 Notes: ${r.vetNotes || 'N/A'}\n`
		    ).join('\n-------------------\n');

		    alert(`Medical History for ${petName}:\n\n` + (historyText || 'No records found.'));
		}
		function viewPetHistory(petId, petName) {
		    // Opens printable report in a clean new tab
		    window.open(`report.html?petId=${petId}`, '_blank');
		}
    </script>
</body>
</html>
